[project]
name = "videoflow-gflow-plugin"
version = "0.1.0"
description = "VideoFlow plugin bridge for Google Flow (gflow-cli)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "python-multipart>=0.0.12,<1.0",
    "mcp>=1.0.0,<3.0",
    "httpx>=0.27.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pyinstaller>=6.10.0,<7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
